name: Deploy backend to VPS

on:
  push:
    branches: [main]
    # Only run when backend/deployment files change — frontend deploys via Vercel.
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'deploy/**'
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  deploy:
    name: Pull + rebuild backend on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/myuser/fms
            git pull --ff-only origin main
            # Rebuild + restart backend (migrations auto-run on boot).
            # `sg docker` is used because the deploy user's docker-group
            # membership isn't active in non-login shells.
            sg docker -c "docker compose up -d --build backend"
            sg docker -c "docker compose ps backend"
