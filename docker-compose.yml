name: fms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fms_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fms_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fms_app -d fms_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port published — only reachable inside the compose network.
    # The backend and n8n containers reach it via the `db` hostname.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # node:24-alpine defaults to UTC, but report_schedules.run_time (and the
      # cron in services/cronJobs.js that reads it) is entered/compared as
      # Pakistan wall-clock time via the Reports UI's plain <input type="time">
      # (no timezone picker) — without this, a schedule set for e.g. 1:56 PM
      # actually fires 5 hours late, at 1:56 PM UTC. Matches n8n's
      # GENERIC_TIMEZONE below.
      TZ: "Asia/Karachi"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    ports:
      - "127.0.0.1:5000:5000"
    # Published only to localhost — cloudflared (on the host) proxies
    # 127.0.0.1:5000 out to the public tunnel URL.

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    env_file:
      - deploy/.env.n8n
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_HOST: "0.0.0.0"
      # Public webhook base used by n8n itself for the browser editor and any
      # webhook URLs it generates.
      N8N_WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: "Asia/Karachi"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pg_data:
  n8n_data:
