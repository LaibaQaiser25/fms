services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_TO_NUMBER=${WHATSAPP_TO_NUMBER}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
